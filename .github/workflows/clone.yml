name: Clone via SSH

on:
  workflow_dispatch:

jobs:
  clone:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H YOUR_EC2_PUBLIC_IP >> ~/.ssh/known_hosts

      - name: Clone on EC2
        run: |
          ssh ec2-user@YOUR_EC2_PUBLIC_IP "
            cd /home/ec2-user &&
            rm -rf MultiHubApp || true &&
            git clone https://github.com/pundlamahesh/MultiHubApp.git
          "
